<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WTF Gestión</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0f2027;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .brand {
      display: grid;
      gap: 12px;
      max-width: 320px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: linear-gradient(135deg, #15803d, #22c55e);
      font-size: 32px;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      font-size: 26px;
    }
    p {
      margin: 0;
      color: rgba(255,255,255,.72);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="logo">W</div>
    <h1>WTF Gestión</h1>
    <p>Cargando sistema...</p>
  </div>
</body>
</html>
