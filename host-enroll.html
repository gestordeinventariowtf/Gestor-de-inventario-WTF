<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enrolamiento seguro WTF ICG Host</title></head>
<body style="font-family:system-ui;max-width:720px;margin:40px auto;padding:20px;background:#f4f6f8;color:#18202a">
<h1>Enrolamiento seguro del Host</h1>
<p>Solo una cuenta administradora raíz puede completar esta operación. La credencial se muestra una sola vez.</p>
<label>Nombre de terminal<br><input id="name" value="WTF ICG Host" style="width:100%;padding:10px"></label><br><br>
<label>Terminal ID<br><input id="terminalId" style="width:100%;padding:10px"></label><br><br>
<button id="login">Iniciar con Google y enrolar</button><pre id="result" style="white-space:pre-wrap;background:#fff;padding:14px;margin-top:20px"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
const cfg=window.WTF_FIREBASE_CONFIG.firebaseConfig; firebase.initializeApp(cfg); const auth=firebase.auth();
const terminalInput=document.getElementById('terminalId'); const nameInput=document.getElementById('name'); const out=document.getElementById('result');
terminalInput.value='term_4t4K9QdjS64NK_oY5HsiQ2pO';
async function enroll(user){try{const token=await user.getIdToken(true);const response=await fetch('https://us-central1-gestor-de-inventario-wtf-29056.cloudfunctions.net/wtfEnrollHostTerminal',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({terminalId:terminalInput.value,name:nameInput.value,rotate:true})});const data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudo rotar la credencial');out.textContent=JSON.stringify(data,null,2);}catch(error){out.textContent=error.message||String(error)}}
auth.onAuthStateChanged(user=>{if(user) enroll(user)});
document.getElementById('login').onclick=async()=>{const provider=new firebase.auth.GoogleAuthProvider();await auth.signInWithRedirect(provider)};
</script>
</body></html>
