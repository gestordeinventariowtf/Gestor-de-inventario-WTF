<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enrolamiento seguro WTF ICG Host</title></head>
<body style="font-family:system-ui;max-width:720px;margin:40px auto;padding:20px;background:#f4f6f8;color:#18202a">
<h1>Enrolamiento seguro del Host</h1>
<p>Solo una cuenta administradora raíz puede completar esta operación. La credencial se muestra una sola vez.</p>
<label>Nombre de terminal<br><input id="name" value="WTF ICG Host" style="width:100%;padding:10px"></label><br><br>
<label>Terminal ID<br><input id="terminalId" required autocomplete="off" style="width:100%;padding:10px"></label><br><br>
<button id="login">Iniciar con Google y enrolar</button><pre id="result" style="white-space:pre-wrap;background:#fff;padding:14px;margin-top:20px"></pre>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
const cfg=window.WTF_FIREBASE_CONFIG.firebaseConfig; firebase.initializeApp(cfg); const auth=firebase.auth();
const terminalInput=document.getElementById('terminalId'); const nameInput=document.getElementById('name'); const out=document.getElementById('result');
const draftKey='wtf_host_enroll_draft_v1';
let enrollmentStarted=false;

function restoreDraft(){
  try{
    const draft=JSON.parse(sessionStorage.getItem(draftKey)||'null');
    if(draft?.terminalId) terminalInput.value=draft.terminalId;
    if(draft?.name) nameInput.value=draft.name;
  }catch(_){sessionStorage.removeItem(draftKey)}
}

async function enroll(user){
  if(enrollmentStarted)return;
  enrollmentStarted=true;
  try{
    const terminalId=terminalInput.value.trim();
    if(!terminalId)throw new Error('Escribe el Terminal ID de esta computadora.');
    out.textContent='Validando la cuenta y generando la credencial...';
    const token=await user.getIdToken(true);
    const response=await fetch('https://us-central1-gestor-de-inventario-wtf-29056.cloudfunctions.net/wtfEnrollHostTerminal',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({terminalId,name:nameInput.value.trim()||'WTF ICG Host',rotate:true})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'No se pudo rotar la credencial');
    sessionStorage.removeItem(draftKey);
    out.textContent=JSON.stringify(data,null,2);
  }catch(error){
    enrollmentStarted=false;
    out.textContent=error.message||String(error);
  }
}

restoreDraft();
auth.onAuthStateChanged(user=>{if(user&&sessionStorage.getItem(draftKey)) enroll(user)});
document.getElementById('login').onclick=async()=>{
  const terminalId=terminalInput.value.trim();
  if(!terminalId){out.textContent='Escribe el Terminal ID de esta computadora antes de iniciar con Google.';terminalInput.focus();return}
  sessionStorage.setItem(draftKey,JSON.stringify({terminalId,name:nameInput.value.trim()||'WTF ICG Host'}));
  const provider=new firebase.auth.GoogleAuthProvider();
  await auth.signInWithRedirect(provider);
};
</script>
</body></html>
