<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logs de Sistema - WTF</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./app-version.js" defer></script>
  <style>
    :root { --verde:#0a9f28; --borde:#e5e7eb; --gris:#6b7280; --fondo:#f3f4f6; --texto:#111827; --azul:#2563eb; --rojo:#dc2626; --naranja:#d97706; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Segoe UI,Arial,sans-serif; color:var(--texto); background:var(--fondo); }
    .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; background:#fff; border-bottom:1px solid var(--borde); }
    .brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand-icon { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--verde),#2563eb); color:#fff; display:grid; place-items:center; font-weight:900; }
    h1 { margin:0; font-size:19px; line-height:1.2; }
    .sub { color:var(--gris); font-size:12px; font-weight:700; margin-top:2px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    button, .btn { border:1px solid var(--borde); border-radius:9px; background:#fff; color:var(--texto); padding:9px 12px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
    button.primary { border-color:var(--verde); background:var(--verde); color:#fff; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    main { padding:16px; display:grid; gap:14px; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    .card { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:14px; box-shadow:0 8px 22px rgba(15,23,42,.05); }
    .stat span { display:block; color:var(--gris); font-size:11px; text-transform:uppercase; font-weight:900; letter-spacing:.04em; }
    .stat strong { display:block; font-size:24px; margin-top:5px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select { border:1px solid var(--borde); border-radius:9px; padding:10px 12px; font:inherit; background:#fff; min-height:40px; }
    input { flex:1; min-width:min(100%,280px); }
    .table-wrap { overflow:auto; background:#fff; border:1px solid var(--borde); border-radius:12px; }
    table { width:100%; border-collapse:collapse; min-width:980px; }
    th, td { padding:10px 12px; border-bottom:1px solid var(--borde); text-align:left; vertical-align:top; font-size:13px; }
    th { background:#f9fafb; color:#374151; font-size:11px; text-transform:uppercase; letter-spacing:.04em; position:sticky; top:0; z-index:1; }
    tr:hover td { background:#f8fafc; }
    .pill { display:inline-flex; align-items:center; border-radius:999px; padding:4px 8px; font-size:11px; font-weight:900; white-space:nowrap; background:#eff6ff; color:#1d4ed8; }
    .pill.rojo { background:#fee2e2; color:#991b1b; }
    .pill.verde { background:#dcfce7; color:#166534; }
    .pill.naranja { background:#ffedd5; color:#9a3412; }
    .empty { text-align:center; color:var(--gris); padding:30px; font-weight:800; }
    .alert { border:1px solid #bfdbfe; background:#eff6ff; color:#1e3a8a; border-radius:10px; padding:12px; font-weight:800; }
    .error { border-color:#fecaca; background:#fef2f2; color:#991b1b; }
    @media (max-width: 820px) {
      .topbar { align-items:flex-start; flex-direction:column; }
      .actions { width:100%; justify-content:flex-start; }
      .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
      main { padding:10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">W</div>
      <div>
        <h1>Logs de Sistema</h1>
        <div class="sub" id="statusText">Preparando lectura segura...</div>
      </div>
    </div>
    <div class="actions">
      <a class="btn" href="/"><span>←</span> Volver al sistema</a>
      <span id="activeUserBadge" class="btn" style="display:none;cursor:default"></span>
      <button id="loginBtn" class="primary" type="button">Entrar con Google</button>
      <button id="refreshBtn" type="button">Actualizar</button>
    </div>
  </header>
  <main>
    <div id="message" class="alert">Este módulo se carga por separado para no sobrecargar la página principal.</div>
    <section class="cards">
      <div class="card stat"><span>Eventos</span><strong id="statTotal">0</strong></div>
      <div class="card stat"><span>Sesiones</span><strong id="statSessions">0</strong></div>
      <div class="card stat"><span>Inventario</span><strong id="statInventory">0</strong></div>
      <div class="card stat"><span>Mise</span><strong id="statMise">0</strong></div>
    </section>
    <section class="card toolbar">
      <input id="searchInput" type="search" placeholder="Buscar usuario, módulo, acción, producto o detalle...">
      <select id="actionFilter"><option value="todos">Todas las acciones</option></select>
      <button id="exportBtn" type="button">Exportar CSV</button>
    </section>
    <section class="table-wrap">
      <table>
        <thead>
          <tr><th>Fecha</th><th>Usuario</th><th>Email</th><th>Módulo</th><th>Acción</th><th>Producto</th><th>Detalle</th></tr>
        </thead>
        <tbody id="logsBody"><tr><td colspan="7" class="empty">Cargando logs...</td></tr></tbody>
      </table>
    </section>
  </main>
  <script>
    const cfg = window.WTF_FIREBASE_CONFIG || {};
    const stateCfg = cfg.sync || {};
    const authorizedEmail = "henryortiz1704@gmail.com";
    let allRows = [];
    let filteredRows = [];

    function normalizar(value) {
      return String(value || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }
    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value && typeof value.toDate === "function" ? value.toDate() : value);
      return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString("es-DO", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
    }
    function decodeCompressed(value) {
      if (!value || typeof value !== "string" || !window.pako) return null;
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(window.pako.inflate(bytes)));
    }
    function getRowsFromDoc(data) {
      if (!data) return [];
      if (Array.isArray(data.appState)) return data.appState;
      if (data.appState && Array.isArray(data.appState.systemLogs)) return data.appState.systemLogs;
      if (data.appStateCompressed) {
        const decoded = decodeCompressed(data.appStateCompressed);
        if (Array.isArray(decoded)) return decoded;
        if (decoded && Array.isArray(decoded.systemLogs)) return decoded.systemLogs;
      }
      return [];
    }
    function pillClass(action) {
      const text = normalizar(action);
      if (text.includes("eliminar")) return "rojo";
      if (text.includes("agregar") || text.includes("inicio")) return "verde";
      if (text.includes("editar")) return "naranja";
      return "";
    }
    function renderStats(rows) {
      document.getElementById("statTotal").textContent = rows.length;
      document.getElementById("statSessions").textContent = rows.filter((r) => normalizar(r.accion).includes("sesion")).length;
      document.getElementById("statInventory").textContent = rows.filter((r) => normalizar(r.modulo).includes("inventario") || normalizar(r.modulo).includes("cuarto frio")).length;
      document.getElementById("statMise").textContent = rows.filter((r) => normalizar(r.modulo).includes("mise")).length;
    }
    function renderActionOptions(rows) {
      const select = document.getElementById("actionFilter");
      const current = select.value || "todos";
      const actions = Array.from(new Set(rows.map((r) => r.accion || "Evento"))).sort();
      select.innerHTML = '<option value="todos">Todas las acciones</option>' + actions.map((a) => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join("");
      select.value = actions.includes(current) ? current : "todos";
    }
    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[ch]));
    }
    function applyFilters() {
      const term = normalizar(document.getElementById("searchInput").value);
      const action = document.getElementById("actionFilter").value;
      filteredRows = allRows.filter((row) => {
        const matchesAction = action === "todos" || String(row.accion || "") === action;
        const haystack = [row.fecha, row.usuario, row.email, row.modulo, row.accion, row.producto, row.detalle].join(" ");
        return matchesAction && (!term || normalizar(haystack).includes(term));
      });
      renderTable(filteredRows);
    }
    function renderTable(rows) {
      const body = document.getElementById("logsBody");
      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty">Sin eventos para mostrar.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((row) => `<tr>
        <td style="white-space:nowrap;color:var(--gris);font-size:12px">${escapeHtml(formatDate(row.fecha))}</td>
        <td><strong>${escapeHtml(row.usuario || "Sistema")}</strong></td>
        <td style="color:var(--gris);font-size:12px">${escapeHtml(row.email || "")}</td>
        <td>${escapeHtml(row.modulo || "Sistema")}</td>
        <td><span class="pill ${pillClass(row.accion)}">${escapeHtml(row.accion || "Evento")}</span></td>
        <td><strong>${escapeHtml(row.producto || "-")}</strong></td>
        <td style="white-space:normal;max-width:420px">${escapeHtml(row.detalle || "-")}</td>
      </tr>`).join("");
    }
    function exportCsv() {
      const headers = ["Fecha","Usuario","Email","Modulo","Accion","Producto","Detalle"];
      const csvRows = [headers].concat(filteredRows.map((row) => [formatDate(row.fecha), row.usuario || "", row.email || "", row.modulo || "", row.accion || "", row.producto || "", row.detalle || ""]));
      const csv = csvRows.map((cols) => cols.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "wtf-system-logs.csv";
      link.click();
      URL.revokeObjectURL(url);
    }
    function setMessage(text, isError) {
      const box = document.getElementById("message");
      box.textContent = text;
      box.className = "alert" + (isError ? " error" : "");
      document.getElementById("statusText").textContent = text;
    }
    function updateAuthUi(user) {
      const loginBtn = document.getElementById("loginBtn");
      const badge = document.getElementById("activeUserBadge");
      const email = normalizar(user && user.email);
      if (email && email === authorizedEmail) {
        badge.textContent = user.email || "Administrador activo";
        badge.style.display = "inline-flex";
        loginBtn.style.display = "none";
        loginBtn.disabled = true;
        return;
      }
      badge.style.display = "none";
      loginBtn.style.display = "inline-flex";
      loginBtn.disabled = false;
    }
    async function ensureAuth() {
      if (!firebase.apps.length) firebase.initializeApp(cfg.firebaseConfig);
      const auth = firebase.auth();
      if (firebase.auth.Auth && firebase.auth.Auth.Persistence) {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function() {});
      }
      const user = auth.currentUser || await new Promise((resolve) => {
        const timer = setTimeout(() => { unsub(); resolve(null); }, 5e3);
        const unsub = auth.onAuthStateChanged((u) => { clearTimeout(timer); unsub(); resolve(u); });
      });
      updateAuthUi(user);
      if (user && normalizar(user.email) === authorizedEmail) return user;
      return null;
    }
    async function login() {
      if (!firebase.apps.length) firebase.initializeApp(cfg.firebaseConfig);
      const auth = firebase.auth();
      if (firebase.auth.Auth && firebase.auth.Auth.Persistence) {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function() {});
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      const result = await auth.signInWithPopup(provider);
      if (normalizar(result.user && result.user.email) !== authorizedEmail) {
        updateAuthUi(null);
        await auth.signOut();
        throw new Error("Este correo no esta autorizado para ver los logs.");
      }
      updateAuthUi(result.user);
      return result.user;
    }
    async function loadLogs() {
      try {
        setMessage("Leyendo logs desde Firebase...", false);
        const user = await ensureAuth();
        if (!user) {
          setMessage("Inicia sesión con la cuenta autorizada para ver los logs.", false);
          updateAuthUi(null);
          document.getElementById("logsBody").innerHTML = '<tr><td colspan="7" class="empty">Esperando inicio de sesión.</td></tr>';
          return;
        }
        const db = firebase.firestore();
        const collection = stateCfg.collection || "wtfSistema";
        const doc = await db.collection(collection).doc("systemLogs").get();
        allRows = getRowsFromDoc(doc.data()).filter(Boolean).sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));
        renderStats(allRows);
        renderActionOptions(allRows);
        applyFilters();
        setMessage(`Logs cargados: ${allRows.length} evento(s).`, false);
      } catch (error) {
        console.error(error);
        setMessage(error && error.message ? error.message : "No se pudieron cargar los logs.", true);
      }
    }
    document.getElementById("loginBtn").addEventListener("click", () => login().then(loadLogs).catch((error) => setMessage(error.message, true)));
    document.getElementById("refreshBtn").addEventListener("click", loadLogs);
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("actionFilter").addEventListener("change", applyFilters);
    document.getElementById("exportBtn").addEventListener("click", exportCsv);
    loadLogs();
  </script>
</body>
</html>
